<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game - Log In</title>

    <script src="/theme.js?v=2"></script>
    <link rel="stylesheet" href="/style.css">
</head>

<body class="auth-page">

    <main class="auth-layout">

        <aside class="auth-hero" aria-hidden="true">
            <div class="brand">
                <span class="brand-icon">♞</span>
                <span class="brand-name">Chess Game</span>
            </div>
            <div class="hero-board" id="hero-board"></div>
            <p class="hero-tagline">Play a friend in real time.<br>Pick a side, watch the clock, make your move.</p>
        </aside>

        <section class="auth-container">
            <div class="brand brand-mobile">
                <span class="brand-icon">♞</span>
                <span class="brand-name">Chess Game</span>
            </div>

            <div id="auth-card">
                <div id="auth-tabs" role="tablist">
                    <button type="button" id="tab-login" class="auth-tab active" role="tab">Log In</button>
                    <button type="button" id="tab-signup" class="auth-tab" role="tab">Sign Up</button>
                </div>

                <div class="auth-heading">
                    <h2 id="auth-title">Welcome back</h2>
                    <p id="auth-subtitle">Log in to pick a side and start playing.</p>
                </div>

                <form id="login-form" class="auth-form">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" required autocomplete="username" placeholder="Your username">

                    <label for="login-password">Password</label>
                    <div class="password-field">
                        <input type="password" id="login-password" required autocomplete="current-password" placeholder="Your password">
                        <button type="button" class="reveal-btn" data-target="login-password" aria-label="Show password">Show</button>
                    </div>

                    <button type="submit" class="submit-btn">Log In</button>
                </form>

                <form id="signup-form" class="auth-form" hidden>
                    <label for="signup-username">Choose a username</label>
                    <input type="text" id="signup-username" required autocomplete="username" placeholder="This is the name opponents see">

                    <label for="signup-password">Choose a password</label>
                    <div class="password-field">
                        <input type="password" id="signup-password" required autocomplete="new-password" placeholder="Pick something you'll remember">
                        <button type="button" class="reveal-btn" data-target="signup-password" aria-label="Show password">Show</button>
                    </div>

                    <button type="submit" class="submit-btn">Create Account</button>
                </form>

                <p id="auth-error" role="alert"></p>

                <p class="auth-footer">
                    <span id="footer-text">New here?</span>
                    <button type="button" id="footer-switch" class="link-btn">Create an account</button>
                </p>
            </div>
        </section>

    </main>

    <script src="/auth.js"></script>

</body>

</html>
