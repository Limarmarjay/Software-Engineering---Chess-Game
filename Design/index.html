<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <h1>Chess Game</h1>

    <div id="account-bar"></div>

    <div class="seat-buttons" id="seat-buttons"></div>

    <div id="game-info">
        <div class="player-clock" id="black-clock">Black: 10:00</div>
        <div id="status">White's turn</div>
        <div class="player-clock" id="white-clock">White: 10:00</div>
    </div>

    <div id="chessboard"></div>

    <script src="app.js"></script>

</body>

</html>
